<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4de3c0"/>
    </marker>
  </defs>

  <rect width="1120" height="640" fill="#0f1014"/>
  <text x="48" y="58" fill="#f2f3f5" font-size="30" font-weight="650">Why effects can’t reach the native player</text>
  <text x="48" y="88" fill="#8b93a7" font-size="15">Playback Kit can only process audio it can see. TIDAL’s native backend never exposes samples to the renderer.</text>

  <!-- row 1 -->
  <g>
    <rect x="48" y="128" width="180" height="70" rx="10" fill="#1a1c22" stroke="#2c2f3a"/>
    <text x="138" y="158" fill="#f2f3f5" font-size="15" font-weight="600" text-anchor="middle">TIDAL stream</text>
    <text x="138" y="180" fill="#8b93a7" font-size="12" text-anchor="middle">HIGH — AAC (320 kbps)</text>

    <rect x="268" y="128" width="190" height="70" rx="10" fill="#14241f" stroke="#2f7f68"/>
    <text x="363" y="158" fill="#4de3c0" font-size="15" font-weight="600" text-anchor="middle">Browser player</text>
    <text x="363" y="180" fill="#7fd9c3" font-size="12" text-anchor="middle">shaka + &lt;video&gt; element</text>

    <rect x="498" y="128" width="170" height="70" rx="10" fill="#14241f" stroke="#2f7f68"/>
    <text x="583" y="158" fill="#4de3c0" font-size="15" font-weight="600" text-anchor="middle">HTMLMediaElement</text>
    <text x="583" y="180" fill="#7fd9c3" font-size="12" text-anchor="middle">#video-one / #video-two</text>

    <rect x="708" y="116" width="286" height="94" rx="12" fill="#16251f" stroke="#39b38f" stroke-width="2"/>
    <text x="851" y="146" fill="#4de3c0" font-size="15" font-weight="650" text-anchor="middle">Playback Kit graph ✅</text>
    <text x="851" y="168" fill="#bfe9dc" font-size="12" text-anchor="middle">MediaElementSource → pitch → EQ</text>
    <text x="851" y="187" fill="#bfe9dc" font-size="12" text-anchor="middle">→ bass → 8D → delay → reverb</text>

    <rect x="1024" y="128" width="62" height="70" rx="10" fill="#1a1c22" stroke="#2c2f3a"/>
    <text x="1055" y="162" fill="#f2f3f5" font-size="13" font-weight="600" text-anchor="middle">🎧</text>
    <text x="1055" y="182" fill="#8b93a7" font-size="11" text-anchor="middle">out</text>

    <line x1="228" y1="163" x2="262" y2="163" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="458" y1="163" x2="492" y2="163" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="668" y1="163" x2="702" y2="163" stroke="#4de3c0" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <line x1="994" y1="163" x2="1018" y2="163" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="48" y="238" fill="#4de3c0" font-size="12">samples visible to the plugin — speed, pitch and effects all work</text>
  </g>

  <!-- divider -->
  <line x1="48" y1="272" x2="1072" y2="272" stroke="#23252d" stroke-width="1"/>

  <!-- row 2 -->
  <g>
    <rect x="48" y="310" width="180" height="70" rx="10" fill="#1a1c22" stroke="#2c2f3a"/>
    <text x="138" y="340" fill="#f2f3f5" font-size="15" font-weight="600" text-anchor="middle">TIDAL stream</text>
    <text x="138" y="362" fill="#8b93a7" font-size="12" text-anchor="middle">LOSSLESS — BTS</text>

    <rect x="268" y="310" width="190" height="70" rx="10" fill="#2a1718" stroke="#a83a3a"/>
    <text x="363" y="340" fill="#ff8d8d" font-size="15" font-weight="600" text-anchor="middle">Native player</text>
    <text x="363" y="362" fill="#d99a9a" font-size="12" text-anchor="middle">application/vnd.tidal.bts</text>

    <rect x="498" y="298" width="496" height="94" rx="12" fill="#281719" stroke="#a83a3a" stroke-width="2"/>
    <text x="746" y="328" fill="#ff8d8d" font-size="15" font-weight="650" text-anchor="middle">Native audio backend ❌</text>
    <text x="746" y="350" fill="#e0b7b7" font-size="12" text-anchor="middle">no &lt;video&gt;, no MediaElementSource, no AudioContext tap</text>
    <text x="746" y="369" fill="#e0b7b7" font-size="12" text-anchor="middle">the renderer (and Playback Kit) never sees these samples</text>

    <rect x="1024" y="310" width="62" height="70" rx="10" fill="#1a1c22" stroke="#2c2f3a"/>
    <text x="1055" y="344" fill="#f2f3f5" font-size="13" font-weight="600" text-anchor="middle">🎧</text>
    <text x="1055" y="364" fill="#8b93a7" font-size="11" text-anchor="middle">out</text>

    <line x1="228" y1="345" x2="262" y2="345" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="458" y1="345" x2="492" y2="345" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrowRed)"/>
    <line x1="994" y1="345" x2="1018" y2="345" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="48" y="420" fill="#ff8d8d" font-size="12">no samples in the renderer — speed/pitch/effects have nothing to process</text>
  </g>

  <!-- renderer boundary -->
  <line x1="470" y1="286" x2="470" y2="470" stroke="#3a3d47" stroke-dasharray="6 6"/>
  <text x="470" y="492" fill="#6d6d78" font-size="11" text-anchor="middle">renderer boundary</text>

  <!-- bottom note -->
  <rect x="48" y="522" width="1024" height="74" rx="12" fill="#161820" stroke="#2c2f3a"/>
  <text x="68" y="550" fill="#cfd2da" font-size="14" font-weight="600">To make effects work on native, TIDAL would need to expose a native PCM tap (or we replace playback with our own BTS decoder).</text>
  <text x="68" y="574" fill="#8b93a7" font-size="12">TIDAL doesn’t expose one; Shaka can’t load BTS, which is why lossless is native-only. The practical fix is High (320 kbps) on the browser player.</text>
</svg>
